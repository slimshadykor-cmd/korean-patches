name: Publish separate NGB hakuX v2.0 candidate
on:
  push:
    branches: [publish/ngb-v2.0-hakux-20261025]
permissions:
  contents: write
concurrency:
  group: ngb-v2.0-publication
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'slimshadykor-cmd/korean-patches'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Assemble verified candidate and add alongside unchanged common v2.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .release-upload/ngb-v2.0-hakux/publish.py
