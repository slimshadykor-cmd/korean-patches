name: Publish Onechanbara v1.3.0

on:
  push:
    branches: [releases/onechanbara-v1.3.0]
    paths:
      - release-build/onechanbara-v1.3.0/**
      - .github/workflows/publish-onechanbara-v130.yml

permissions:
  contents: write

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

concurrency:
  group: publish-onechanbara-v130
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct and verify the tested patcher
        run: python release-build/onechanbara-v1.3.0/build_release.py --out release-dist
      - name: Validate shipping EXE on Windows .NET Framework
        shell: powershell
        run: ./release-build/onechanbara-v1.3.0/source/validate_windows.ps1
      - name: Preserve Windows validation evidence
        uses: actions/upload-artifact@v4
        with:
          name: onechanbara-v130-windows-validation
          path: release-dist/windows-validation.json
          retention-days: 30
      - name: Publish the official ZIP
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view onechanbara-v1.3.0 >/dev/null 2>&1; then
            gh release create onechanbara-v1.3.0 --draft --target "$GITHUB_SHA" \
              --title "오네찬바라 볼텍스 한글패치 v1.3.0 — 시스템 문구 보완" \
              --notes-file release-build/onechanbara-v1.3.0/release-notes.md
          else
            existing_target=$(gh release view onechanbara-v1.3.0 --json targetCommitish --jq .targetCommitish)
            # Authorized same-version asset replacement; preserve the existing release URL/tag.
            test "$existing_target" = "b9251a66b11dc0982f286f8aeabf46b4375c7b0c"
            old_digest=$(gh api repos/slimshadykor-cmd/korean-patches/releases/tags/onechanbara-v1.3.0 --jq '.assets[] | select(.name == "Onechanbara_ISO_Korean_v1.3.0_Release.zip") | .digest')
            test "$old_digest" = "sha256:584a4808c00f6053aad5d91a6b54623ecb6b3c6b73f1230da10d13b022f0d502"
          fi
          gh release upload onechanbara-v1.3.0 \
            release-dist/Onechanbara_ISO_Korean_v1.3.0_Release.zip --clobber
          gh release edit onechanbara-v1.3.0 --draft=false --latest=false \
            --title "오네찬바라 볼텍스 한글패치 v1.3.0 — 시스템 문구 보완" \
            --notes-file release-build/onechanbara-v1.3.0/release-notes.md
      - name: Link previous Onechanbara release pages to v1.3.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: python release-build/onechanbara-v1.3.0/source/update_previous_links.py
