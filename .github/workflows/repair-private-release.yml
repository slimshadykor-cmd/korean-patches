 795, 353, 517, 628, 205, 328, 479, 951, 373, 113, 541, 783, 687, 231, 1092, 520, 633, 1029, 1028, 59, 175, 535, 516, 1114, 47, 959, 622, 419, 411, 992, 712, 534, 239, 262, 285, 530, 379, 408, 711, 744, 248, 413, 57, 88, 404, 865, 414, 983, 295, 966, 847, 696, 1131, 957, 979, 442, 867, 1124, 49, 730, 499, 160, 765, 1002, 608, 282, 935, 848, 661, 313, 1018, 576, 982, 351, 678, 627, 945, 369, 448, 427, 255, 720, 283, 1051, 756, 644, 434, 464, 763, 1122, 839, 1116, 932, 914, 588, 118, 638, 410, 1064, 1047, 801, 266, 97, 1036, 312, 899, 1086, 649, 648, 202, 889, 749, 1014, 246, 7, 547, 197, 472, 774, 715, 968, 550, 27, 527, 860, 572, 234, 137, 574, 257, 218, 598, 1084, 568, 1098, 785, 1022, 585, 677, 306, 843, 374, 832, 651, 112, 125, 908, 1056, 642, 1059, 893, 1026, 387, 742, 794, 1089, 391, 721, 303, 924, 458, 1049, 809, 548, 915, 545, 999, 400, 1147, 1021, 929, 977, 1128, 446, 1032, 546, 356, 629, 1087, 1154, 483, 1120, 675, 853, 544, 507, 595, 151, 90, 973, 639, 324, 937, 987, 1065, 308, 1097, 748, 559, 577, 562, 409, 603, 669, 435, 178, 77, 947, 750, 401, 134, 61, 506, 141, 1019, 149, 210, 437, 454, 58, 261, 17, 904, 580, 78, 539, 1069, 1132, 235, 335, 121, 133, 74, 473, 155, 920, 1063, 494, 891, 423, 515, 50, 8, 758, 281, 459, 136, 157, 1068, 984, 508, 355, 724, 252, 105, 293, 555, 554, 433, 368, 122, 352, 826, 827, 154, 406, 679, 377, 918, 3, 1041, 123, 76, 397, 556, 116, 1, 31, 297, 40, 768, 20, 878, 380, 370, 338, 851, 729, 808, 298, 887, 145, 16, 453, 691, 500, 958, 621, 372, 367, 301, 743, 1158, 820, 842, 599, 1106, 542, 760, 698, 881, 701, 86, 363, 616, 1076, 486, 1040, 342, 950, 104, 910, 1004, 1020, 1130, 971, 461, 817, 593, 1025, 318, 421, 919, 802, 466, 337, 735, 990, 816, 468, 1088, 140, 1037, 976, 348, 909, 349, 775, 381, 260, 444, 584, 1016, 264, 19, 93, 131, 357, 954, 814, 188, 789, 684, 856, 563, 54, 667, 734, 938, 315, 195, 764, 1078, 1152, 22, 612, 521, 831, 1038, 645, 1113, 69, 333, 868]
          ROOT = 'Kenzan_Korean_Patch_ISO_v1.1/'
          
          def api(endpoint, method='GET', data=None, upload=None):
              args=['gh','api','--method',method,endpoint]
              if upload:
                  args += ['-H','Content-Type: application/zip','--input',str(upload)]
              elif data is not None:
                  args += ['--input','-']
              result=subprocess.run(args,input=json.dumps(data) if data is not None else None,text=True,capture_output=True,check=True)
              return json.loads(result.stdout) if result.stdout.strip() else None
          
          def release():
              r=api(f'repos/{REPO}/releases/{RELEASE}')
              assert r['draft'] is True and r['published_at'] is None, 'Target must remain an unpublished draft'
              assert '켄잔' in r['name'], 'Wrong release'
              return r
          
          initial=release()
          original=next(a for a in initial['assets'] if a['id']==ASSET_ID)
          assert original['name']==NAME and original['digest']=='sha256:'+OLD_ZIP
          untouched={a['id']:(a['name'],a['digest']) for a in initial['assets'] if a['id']!=ASSET_ID}
          source=pathlib.Path('source.zip')
          with source.open('wb') as output:
              subprocess.run(['gh','api',f'repos/{REPO}/releases/assets/{ASSET_ID}','-H','Accept: application/octet-stream'],stdout=output,stderr=subprocess.PIPE,check=True)
          assert hashlib.file_digest(source.open('rb'),'sha256').hexdigest()==OLD_ZIP
          fixed=pathlib.Path(NAME)
          with zipfile.ZipFile(source) as src:
              manifest_bytes=src.read(ROOT+'manifest.json')
              assert hashlib.sha256(manifest_bytes).hexdigest()==NEW_PIN.decode()
              manifest=json.loads(manifest_bytes)
              assert manifest['version']=='1.1' and manifest['title_id']=='BLJM60064' and len(manifest['files'])==1160
              assert hashlib.sha256(src.read(ROOT+'tools/xdelta.exe')).hexdigest()==manifest['decoder_sha256']
              for row in manifest['files']:
                  if row['kind']=='verify':continue
                  data=src.read(ROOT+row['payload'])
                  assert len(data)==row['payload_size'] and hashlib.sha256(data).hexdigest()==row['payload_sha256']
              core=src.read(ROOT+'tools/core.ps1')
              assert core.count(OLD_PIN)==1
              corrected_core=core.replace(OLD_PIN,NEW_PIN)
              items=src.infolist()
              assert sorted(ORDER)==list(range(len(items)))
              with zipfile.ZipFile(fixed,'w',zipfile.ZIP_DEFLATED,compresslevel=6) as dst:
                  for index in ORDER:
                      info=items[index]
                      data=corrected_core if info.filename==ROOT+'tools/core.ps1' else src.read(info.filename)
                      dst.writestr(info,data)
          with zipfile.ZipFile(source) as src,zipfile.ZipFile(fixed) as dst:
              assert set(src.namelist())==set(dst.namelist())
              changes=[]
              for name in src.namelist():
                  if src.read(name)!=dst.read(name):changes.append(name)
              assert changes==[ROOT+'tools/core.ps1']
          digest=hashlib.file_digest(fixed.open('rb'),'sha256').hexdigest()
          assert digest==EXPECTED_ZIP, 'Rebuilt ZIP differs from the verified local replacement'
          assert fixed.stat().st_size==258360995
          assert release()['body']==initial['body'], 'Release changed during preparation'
          temporary_name='Kenzan_Korean_Patch_ISO_v1.1.replacement.zip'
          assert not any(a['name']==temporary_name for a in release()['assets'])
          created=api(f'https://uploads.github.com/repos/{REPO}/releases/{RELEASE}/assets?name='+urllib.parse.quote(temporary_name),method='POST',upload=fixed)
          new_id=created['id']
          uploaded=api(f'repos/{REPO}/releases/assets/{new_id}')
          assert uploaded['size']==fixed.stat().st_size and uploaded['digest']=='sha256:'+digest
          roundtrip=pathlib.Path('uploaded-check.zip')
          with roundtrip.open('wb') as output:
              subprocess.run(['gh','api',f'repos/{REPO}/releases/assets/{new_id}','-H','Accept: application/octet-stream'],stdout=output,stderr=subprocess.PIPE,check=True)
          assert hashlib.file_digest(roundtrip.open('rb'),'sha256').hexdigest()==digest
          with zipfile.ZipFile(roundtrip) as z:assert z.testzip() is None
          release()
          backup_name='Kenzan_Korean_Patch_ISO_v1.1.before-startfix.zip'
          assert not any(a['name']==backup_name for a in release()['assets'])
          api(f'repos/{REPO}/releases/assets/{ASSET_ID}',method='PATCH',data={'name':backup_name})
          try:
              api(f'repos/{REPO}/releases/assets/{new_id}',method='PATCH',data={'name':NAME})
          except Exception:
              api(f'repos/{REPO}/releases/assets/{ASSET_ID}',method='PATCH',data={'name':NAME})
              raise
          current=release()
          assert next(a for a in current['assets'] if a['id']==new_id)['name']==NAME
          old_row='| ISO용 | 258,360,996 | `'+OLD_ZIP+'` |'
          new_row='| ISO용 | 258,360,995 | `'+digest+'` |'
          assert current['body']==initial['body'] and current['body'].count(old_row)==1
          body=current['body'].replace(old_row,new_row)
          note='<!-- kenzan-v11-startfix-20261023 -->\n### 2026-10-23 ISO 패처 시작 오류 수정\n\n정상 v1.1 패치 목록을 잘못된 이전 검사값과 비교해 “패치 목록이 손상되었습니다”로 중단되던 오류를 수정했습니다. ISO용 tools/core.ps1의 검사값만 수정했으며, 기존 한글·그래픽 패치 자료는 동일합니다. 같은 초기화 오류의 재현 및 수정 후 패치 항목 1,160개 로딩, 패치 자료 해시 검사를 확인했습니다. 실제 Windows GUI와 전체 게임 ISO 생성·플레이 검증은 별도입니다.\n\n'
          assert '## v1.1 — ISO용·폴더용 통합 패치' in body
          body=body.replace('## v1.1 — ISO용·폴더용 통합 패치',note+'## v1.1 — ISO용·폴더용 통합 패치',1)
          api(f'repos/{REPO}/releases/{RELEASE}',method='PATCH',data={'body':body,'draft':True})
          checked=release()
          assert checked['body']==body
          assert {a['id']:(a['name'],a['digest']) for a in checked['assets'] if a['id'] not in (ASSET_ID,new_id)}==untouched
          api(f'repos/{REPO}/releases/assets/{ASSET_ID}',method='DELETE')
          final=release()
          assert len(final['assets'])==len(initial['assets']) and not any(a['id']==ASSET_ID for a in final['assets'])
          asset=next(a for a in final['assets'] if a['name']==NAME)
          assert asset['id']==new_id and asset['digest']=='sha256:'+digest
          print(json.dumps({'result':'PASS','release_id':RELEASE,'draft':final['draft'],'published_at':final['published_at'],'asset_id':new_id,'size':asset['size'],'sha256':digest,'other_assets_unchanged':True}))
