name: Repair private release attachment
on:
  push:
    branches: [main]
    paths: [.github/workflows/repair-private-release.yml]
permissions:
  contents: write
concurrency:
  group: repair-kenzan-private-release
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
