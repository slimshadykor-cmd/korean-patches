name: Publish NGB v2.0 talisman equipment update
on:
  push:
    branches: [publish/ngb-v2.0-talisman-20261026]
permissions:
  contents: write
concurrency:
  group: ngb-v2.0-publication
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'slimshadykor-cmd/korean-patches'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Assemble verified public package and replace existing v2.0 assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .release-upload/ngb-v2.0-talisman/publish.py
