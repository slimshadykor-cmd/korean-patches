name: Publish NGB v1.8 and notify v1.7 visitors
on:
  push:
    branches:
      - publish/ngb-v1.8-20261024
permissions:
  contents: write
concurrency:
  group: ngb-v1.8-publication
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'slimshadykor-cmd/korean-patches'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out verified release inputs
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Publish v1.8 and add the v1.7 upgrade notice
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .release-upload/ngb-v1.8/publish.py
