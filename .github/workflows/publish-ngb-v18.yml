name: Update NGB previous-version navigation
on:
  push:
    branches:
      - publish/ngb-v1.8-20261024
permissions:
  contents: write
concurrency:
  group: ngb-v1.8-publication
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'slimshadykor-cmd/korean-patches'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Link all previous NGB releases to current v1.8
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .release-upload/ngb-v1.8/update_navigation.py
