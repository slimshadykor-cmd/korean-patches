name: Update NGB original ISO hashes
on:
  push:
    branches: [main]
    paths: ['.github/update_ngb_hashes.py', '.github/workflows/update-ngb-hashes.yml']
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read this public repository
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          git init .
          git remote add origin https://github.com/slimshadykor-cmd/korean-patches.git
          git fetch --depth=1 origin "$EXPECTED_COMMIT"
          git checkout --detach FETCH_HEAD
      - name: Update release notes and original ISO hash file
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/update_ngb_hashes.py
