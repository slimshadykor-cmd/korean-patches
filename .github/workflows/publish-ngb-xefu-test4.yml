name: Publish verified NGB XeFu Test4
on:
  push:
    branches: [publish/ngb-xefu-test4-20261104]
permissions:
  contents: write
concurrency:
  group: ngb-v2.0-publication
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'slimshadykor-cmd/korean-patches'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Reconstruct exact tested ZIP and publish Test4
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .release-upload/ngb-xefu-test4/publish.py --publish
